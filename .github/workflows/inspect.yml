name: real-steps
on: push
jobs:
 test:
   runs-on: ubuntu-latest
   steps:
     - name: checkout the action
       uses: actions/checkout@v4
     - name: print runner's kernel details
       run: |
          echo "=== Operating System & Kernel Details ==="
          uname -a
     - name: List Repository Files
       run: |
          echo "=== Current Workspace Path ==="
          pwd
          echo "=== Recursive File Listing ==="
          ls -R

